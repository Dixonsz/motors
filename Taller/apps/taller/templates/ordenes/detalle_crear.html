<!-- detalle_crear.html -->
{% extends 'base.html' %}
{% block title %}Agregar Servicio{% endblock %}
{% block page_title %}Agregar Servicio a Orden #{{ orden.id }}{% endblock %}

{% block page_actions %}
<nav aria-label="Navegacion de ordenes">
    <a
        class="rounded-md border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 transition-colors hover:border-slate-400"
        href="{% url 'orden_detalle' orden.id %}"
    >
        Regresar
    </a>
</nav>
{% endblock %}

{% block content %}
<div class="border border-slate-200 bg-white p-6 shadow-sm">
    <form action="" class="grid gap-6" method="post">
        {% csrf_token %}

        <div class="grid gap-2">
            <label class="text-sm font-semibold text-slate-600" for="servicio_id">Servicio</label>
            <select class="rounded-md border-slate-200 text-sm" name="servicio_id" id="servicio_id" required>
                <option value="">Seleccione un servicio</option>
                {% for servicio in servicios %}
                    <option value="{{ servicio.id }}">{{ servicio.nombre }} - ₡{{ servicio.precio_base }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="grid gap-4 md:grid-cols-2">
            <div class="grid gap-2">
                <label class="text-sm font-semibold text-slate-600" for="precio">Precio</label>
                <input class="rounded-md border-slate-200 text-sm" type="number" name="precio" id="precio" min="0" required>
            </div>
            <div class="grid gap-2">
                <label class="text-sm font-semibold text-slate-600" for="cantidad">Cantidad</label>
                <input class="rounded-md border-slate-200 text-sm" type="number" name="cantidad" id="cantidad" min="1" value="1" required>
            </div>
        </div>

        <div class="grid gap-2">
            <label class="text-sm font-semibold text-slate-600" for="observaciones">Observaciones</label>
            <textarea class="min-h-[120px] rounded-md border-slate-200 text-sm" name="observaciones" id="observaciones" placeholder="Observaciones"></textarea>
        </div>

        <div class="flex flex-wrap items-center justify-end gap-3">
            <a
                class="rounded-md border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 transition-colors hover:border-slate-400"
                href="{% url 'orden_detalle' orden.id %}"
            >
                Cancelar
            </a>
            <button
                class="rounded-md bg-primary px-5 py-2 text-sm font-semibold text-white transition-colors hover:bg-slate-800"
                type="submit"
            >
                Agregar servicio
            </button>
        </div>
    </form>
</div>
{% endblock %}
