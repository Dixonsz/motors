{% extends 'base.html' %}
{%load static %}

{% block extra_head %}
<link rel="stylesheet" type="text/css" href="{% static 'css/configuracion_form.css' %}">
{% endblock %}

{% block content %}
<section class="max-w-3xl">
  <div class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
    <h3 class="text-lg font-semibold text-slate-900">{{ accion }} configuracion</h3>
    <p class="mt-2 text-sm text-slate-500">Configura las reglas de bloqueo y el horario laboral.</p>

    <form class="mt-6 space-y-6" method="POST">
      {% csrf_token %}

      <label class="block text-sm font-semibold text-slate-700" for="tipo">
        Tipo de configuracion
        <select class="mt-2 w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-2 text-sm text-slate-900" name="tipo" id="tipo" required>
          <option value="">-- Seleccionar --</option>
          <option value="dia_completo" {% if bloqueo.tipo == "dia_completo" %}selected{% endif %}>Dia completo</option>
          <option value="franja" {% if bloqueo.tipo == "franja" %}selected{% endif %}>Franja horaria</option>
          <option value="laboral" {% if bloqueo.tipo == "laboral" %}selected{% endif %}>Horario laboral</option>
        </select>
      </label>

      <div class="grid gap-5 md:grid-cols-2">
        <label class="block text-sm font-semibold text-slate-700" for="fecha_inicio" id="campo-fecha-inicio">
          Fecha inicio
          <input class="mt-2 w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-2 text-sm text-slate-900" type="date" id="fecha_inicio" name="fecha_inicio" value="{{ bloqueo.fecha_inicio|default:'' }}">
        </label>
        <label class="block text-sm font-semibold text-slate-700" for="fecha_fin" id="campo-fecha-fin">
          Fecha fin
          <span class="block text-xs font-normal text-slate-500">Para rangos</span>
          <input class="mt-2 w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-2 text-sm text-slate-900" type="date" id="fecha_fin" name="fecha_fin" value="{{ bloqueo.fecha_fin|default:'' }}">
        </label>
      </div>

      <div id="campos-horario" class="space-y-5">
        <div class="grid gap-5 md:grid-cols-2">
          <label class="block text-sm font-semibold text-slate-700" for="hora_inicio">
            Hora inicio
            <input class="mt-2 w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-2 text-sm text-slate-900" type="time" id="hora_inicio" name="hora_inicio" value="{{ bloqueo.hora_inicio|time:"H:i"|default:'' }}">
          </label>
          <label class="block text-sm font-semibold text-slate-700" for="hora_fin">
            Hora fin
            <input class="mt-2 w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-2 text-sm text-slate-900" type="time" id="hora_fin" name="hora_fin" value="{{ bloqueo.hora_fin|time:"H:i"|default:'' }}">
          </label>
        </div>

        <label class="block text-sm font-semibold text-slate-700" for="capacidad_maxima" id="campo-capacidad">
          Capacidad maxima
          <span class="block text-xs font-normal text-slate-500">Dejar vacio para bloqueo total</span>
          <input class="mt-2 w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-2 text-sm text-slate-900" type="number" id="capacidad_maxima" name="capacidad_maxima" min="1" value="{{ bloqueo.capacidad_maxima|default:'' }}">
        </label>
      </div>

      <div id="campos-laboral" class="space-y-4">
        <div>
          <p class="text-sm font-semibold text-slate-700">Dias laborales</p>
          <div class="mt-3 grid gap-2 md:grid-cols-3">
            <label class="flex items-center gap-2 text-sm text-slate-700" for="dia-lun">
              <input class="h-4 w-4 rounded border-slate-300 text-slate-900" type="checkbox" id="dia-lun" name="dias_laborales" value="0" {% if bloqueo and bloqueo.dias_laborales and 0 in bloqueo.dias_laborales %}checked{% endif %}>
              Lunes
            </label>
            <label class="flex items-center gap-2 text-sm text-slate-700" for="dia-mar">
              <input class="h-4 w-4 rounded border-slate-300 text-slate-900" type="checkbox" id="dia-mar" name="dias_laborales" value="1" {% if bloqueo and bloqueo.dias_laborales and 1 in bloqueo.dias_laborales %}checked{% endif %}>
              Martes
            </label>
            <label class="flex items-center gap-2 text-sm text-slate-700" for="dia-mie">
              <input class="h-4 w-4 rounded border-slate-300 text-slate-900" type="checkbox" id="dia-mie" name="dias_laborales" value="2" {% if bloqueo and bloqueo.dias_laborales and 2 in bloqueo.dias_laborales %}checked{% endif %}>
              Miercoles
            </label>
            <label class="flex items-center gap-2 text-sm text-slate-700" for="dia-jue">
              <input class="h-4 w-4 rounded border-slate-300 text-slate-900" type="checkbox" id="dia-jue" name="dias_laborales" value="3" {% if bloqueo and bloqueo.dias_laborales and 3 in bloqueo.dias_laborales %}checked{% endif %}>
              Jueves
            </label>
            <label class="flex items-center gap-2 text-sm text-slate-700" for="dia-vie">
              <input class="h-4 w-4 rounded border-slate-300 text-slate-900" type="checkbox" id="dia-vie" name="dias_laborales" value="4" {% if bloqueo and bloqueo.dias_laborales and 4 in bloqueo.dias_laborales %}checked{% endif %}>
              Viernes
            </label>
            <label class="flex items-center gap-2 text-sm text-slate-700" for="dia-sab">
              <input class="h-4 w-4 rounded border-slate-300 text-slate-900" type="checkbox" id="dia-sab" name="dias_laborales" value="5" {% if bloqueo and bloqueo.dias_laborales and 5 in bloqueo.dias_laborales %}checked{% endif %}>
              Sabado
            </label>
            <label class="flex items-center gap-2 text-sm text-slate-700" for="dia-dom">
              <input class="h-4 w-4 rounded border-slate-300 text-slate-900" type="checkbox" id="dia-dom" name="dias_laborales" value="6" {% if bloqueo and bloqueo.dias_laborales and 6 in bloqueo.dias_laborales %}checked{% endif %}>
              Domingo
            </label>
          </div>
        </div>
      </div>

      <label class="block text-sm font-semibold text-slate-700" for="recurrencia" id="campo-recurrencia">
        Recurrencia
        <select class="mt-2 w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-2 text-sm text-slate-900" name="recurrencia" id="recurrencia">
          <option value="ninguna" {% if bloqueo.recurrencia == "ninguna" %}selected{% endif %}>Sin recurrencia</option>
          <option value="diaria" {% if bloqueo.recurrencia == "diaria" %}selected{% endif %}>Diaria</option>
          <option value="semanal" {% if bloqueo.recurrencia == "semanal" %}selected{% endif %}>Semanal</option>
          <option value="mensual" {% if bloqueo.recurrencia == "mensual" %}selected{% endif %}>Mensual</option>
        </select>
      </label>

      <label class="block text-sm font-semibold text-slate-700" for="motivo">
        Motivo
        <input class="mt-2 w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-2 text-sm text-slate-900" type="text" id="motivo" name="motivo" placeholder="Ej: Feriado nacional, Almuerzo, Mantenimiento..." value="{{ bloqueo.motivo|default:'' }}">
      </label>

      {% if bloqueo %}
      <label class="flex items-center gap-2 text-sm text-slate-700" for="activo">
        <input class="h-4 w-4 rounded border-slate-300 text-slate-900" type="checkbox" name="activo" id="activo" {% if bloqueo.activo %}checked{% endif %}>
        Activo
      </label>
      {% endif %}

      <div class="flex flex-wrap items-center gap-3 pt-2">
        <a class="px-4 py-2 text-sm font-semibold text-slate-500 transition-colors hover:text-slate-700" href="{% url 'configuracion_lista' %}">Cancelar</a>
        <button class="bg-slate-900 px-5 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-slate-700" type="submit">{{ accion }}</button>
      </div>
    </form>
  </div>
</section>

<script src="{% static 'js/configuracion_form.js' %}"></script>
{% endblock %}
