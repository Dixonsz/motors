{% extends 'base.html' %} {% load static %} {% block extra_head %}
<link
  href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css"
  rel="stylesheet"
/>
<link rel="stylesheet" href="{% static 'css/calendario.css' %}" />
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

{% endblock %} {% block content %}

<div id="vista-calendario">
  <div id="calendar-wrapper">
    <div id="calendar"></div>
  </div>

  <!-- ── Drawer nueva cita ── -->
  <div id="drawer-cita">
    <div class="drawer-header">
      <h3>Nueva cita <span id="drawer-fecha-label"></span></h3>
      <button class="btn-cerrar-drawer" onclick="cerrarDrawer()" title="Cerrar">
        &#x2715;
      </button>
    </div>

    <div class="drawer-body">
      <!-- Fecha y hora -->
      <div class="drawer-seccion">
        <p class="drawer-seccion-titulo">Horario</p>
        <div class="fila-2">
          <div class="campo">
            <label>Fecha</label>
            <input type="date" id="nc-fecha" />
          </div>
          <div class="campo">
            <label>Hora de inicio</label>
            <input type="time" id="nc-hora" />
          </div>
        </div>
      </div>

      <!-- Cliente y vehículo -->
      <div class="drawer-seccion">
        <p class="drawer-seccion-titulo">Cliente y vehículo</p>

        <div class="campo">
          <label>
            Cliente
            <span class="opcional">(opcional si elige vehículo)</span>
          </label>
          <select id="nc-cliente">
            <option value="">Sin cliente</option>
          </select>
        </div>

        <div class="campo">
          <label>
            Vehículo
            <span class="opcional">(opcional si elige cliente)</span>
          </label>
          <select id="nc-vehiculo">
            <option value="">Sin vehículo</option>
          </select>
        </div>
      </div>

      <!-- Detalles -->
      <div class="drawer-seccion">
        <p class="drawer-seccion-titulo">Detalles</p>

        <div class="campo">
          <label>Estado</label>
          <select id="nc-estado"></select>
        </div>

        <div class="campo">
          <label>
            Servicios
            <span class="opcional">(Ctrl+clic para varios)</span>
          </label>
          <select id="nc-servicios" multiple></select>
        </div>

        <div class="campo">
          <label>Usuario asignado</label>
          <select id="nc-usuario"></select>
        </div>

        <div class="campo">
          <label>Anotaciones</label>
          <textarea
            id="nc-anotaciones"
            placeholder="Notas adicionales..."
          ></textarea>
        </div>
      </div>

      <div id="nc-error" class="drawer-error"></div>
    </div>

    <div class="drawer-footer">
      <button class="btn-secundario" onclick="cerrarDrawer()">Cancelar</button>
      <button class="btn-primario" id="btn-guardar" onclick="guardarCita()">
        Guardar cita
      </button>
    </div>
  </div>
</div>

<!-- ── Modal detalle cita existente ── -->
<div id="overlay-detalle" class="overlay" onclick="cerrarModalDetalle()"></div>
<div id="modal-detalle" class="modal-detalle">
  <h3 id="modal-title"></h3>
  <div class="detalle-fila">
    <span class="detalle-label">Estado</span>
    <span id="modal-estado" class="badge-estado"></span>
  </div>
  <div class="detalle-fila">
    <span class="detalle-label">Cliente</span>
    <span id="modal-cliente" class="detalle-valor"></span>
  </div>
  <div class="detalle-fila">
    <span class="detalle-label">Vehículo</span>
    <span id="modal-vehiculo" class="detalle-valor"></span>
  </div>
  <div class="modal-footer">
    <button class="btn-secundario" onclick="cerrarModalDetalle()">
      Cerrar
    </button>
    <a
      id="modal-link"
      href="#"
      class="btn-primario"
      style="text-decoration: none"
    >
      Ver detalle
    </a>
  </div>
</div>

<script>
  const URL_EVENTOS = "{% url 'citas_calendario_json' %}";
  const URL_FORM_DATA = "{% url 'calendario_form_data' %}";
  const URL_VEHICULOS = "{% url 'calendario_vehiculos' cliente_id=0 %}".replace("/0/","/",);
  const URL_CREAR = "{% url 'calendario_crear_cita' %}";
  const CSRF_TOKEN = "{{ csrf_token }}";
</script>

<script src="{% static 'js/calendario.js' %}"></script>

{% endblock %}
