{% extends 'base.html' %}

{% block extra_head %}
<!-- FullCalendar CDN -->
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css' rel='stylesheet' />
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
{% endblock %}

{% block content %}
<div id='calendar'></div>

<!-- Modal -->
<div id="modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:20px; border-radius:8px; z-index:1000; min-width:300px;">
    <h3 id="modal-title"></h3>
    <p><strong>Estado:</strong> <span id="modal-estado"></span></p>
    <p><strong>Cliente:</strong> <span id="modal-cliente"></span></p>
    <p><strong>Vehículo:</strong> <span id="modal-vehiculo"></span></p>
    <div style="margin-top:10px;">
        <a id="modal-link" href="#">Ver detalle completo</a>
        <button onclick="cerrarModal()">Cerrar</button>
    </div>
</div>
<div id="overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:999;" onclick="cerrarModal()"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const calendarEl = document.getElementById('calendar');

    const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'timeGridWeek',   // vista semanal por defecto
        locale: 'es',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        events: "{% url 'citas_calendario_json' %}",  // llama al endpoint
        eventClick: function(info) {
            const props = info.event.extendedProps;
            document.getElementById('modal-title').textContent = info.event.title;
            document.getElementById('modal-estado').textContent = props.estado;
            document.getElementById('modal-cliente').textContent = props.cliente || 'Sin cliente';
            document.getElementById('modal-vehiculo').textContent = props.vehiculo || 'Sin vehículo';
            document.getElementById('modal-link').href = `/citas/${info.event.id}/`;
            document.getElementById('modal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }
    });

    calendar.render();
});

function cerrarModal() {
    document.getElementById('modal').style.display = 'none';
    document.getElementById('overlay').style.display = 'none';
}
</script>

{% endblock %}
