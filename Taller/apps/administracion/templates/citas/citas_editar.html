<!-- citas_editar.html -->
{% extends 'base.html' %}
{% block title %}Editar Cita{% endblock %}
{% block page_title %}Editar Cita{% endblock %}

{% block page_actions %}
<nav aria-label="Navegacion de citas">
    <a
        class="rounded-md border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 transition-colors hover:border-slate-400"
        href="{% url 'citas_lista' %}"
    >
        Regresar
    </a>
</nav>
{% endblock %}

{% block content %}
<div class="border border-slate-200 bg-white p-6 shadow-sm">
    <form action="" class="grid gap-6" method="post">
        {% csrf_token %}

        <div class="grid gap-2">
            <label class="text-sm font-semibold text-slate-600" for="cliente_id">Cliente</label>
            <select class="rounded-md border-slate-200 text-sm" name="cliente_id" id="cliente_id">
                <option value="">Sin cliente</option>
                {% for cliente in clientes %}
                    <option value="{{ cliente.id }}" {% if cita.cliente and cita.cliente.id == cliente.id %}selected{% endif %}>
                        {{ cliente.nombre }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="grid gap-2">
            <label class="text-sm font-semibold text-slate-600" for="vehiculo_id">Vehículo</label>
            <select class="rounded-md border-slate-200 text-sm" name="vehiculo_id" id="vehiculo_id">
                <option value="">Sin vehículo</option>
                {% for vehiculo in vehiculos %}
                    <option value="{{ vehiculo.id }}" {% if cita.vehiculo and cita.vehiculo.id == vehiculo.id %}selected{% endif %}>
                        {{ vehiculo.placa }} - {{ vehiculo.cliente.nombre }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <fieldset class="rounded-lg border border-slate-200 p-4">
            <legend class="px-2 text-xs font-semibold uppercase tracking-widest text-slate-400">Servicios</legend>
            <div class="grid gap-3 sm:grid-cols-2">
                {% for servicio in servicios %}
                    <label class="flex items-start gap-2 rounded-md border border-slate-100 bg-slate-50 px-3 py-2 text-sm text-slate-700">
                        <input
                            class="mt-1 rounded border-slate-300"
                            type="checkbox"
                            name="servicios_id"
                            value="{{ servicio.id }}"
                            {% if servicio in cita.servicio.all %}checked{% endif %}
                        >
                        <span>
                            <span class="font-semibold">{{ servicio.nombre }}</span>
                            <span class="mt-1 block text-xs text-slate-500">₡{{ servicio.precio_base }}</span>
                        </span>
                    </label>
                {% endfor %}
            </div>
        </fieldset>

        <div class="grid gap-2">
            <label class="text-sm font-semibold text-slate-600" for="usuario_id">Usuario</label>
            <select class="rounded-md border-slate-200 text-sm" name="usuario_id" id="usuario_id" required>
                <option value="">Seleccione un usuario</option>
                {% for usuario in usuarios %}
                    <option value="{{ usuario.id }}" {% if cita.usuario.id == usuario.id %}selected{% endif %}>
                        {{ usuario.nombre }} {{ usuario.apellido }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="grid gap-4 md:grid-cols-2">
            <div class="grid gap-2">
                <label class="text-sm font-semibold text-slate-600" for="fecha">Fecha</label>
                <input
                    class="rounded-md border-slate-200 text-sm"
                    type="date"
                    name="fecha"
                    id="fecha"
                    value="{{ cita.fecha|date:'Y-m-d' }}"
                    required
                >
            </div>
            <div class="grid gap-2">
                <label class="text-sm font-semibold text-slate-600" for="hora_inicio">Hora de inicio</label>
                <input
                    class="rounded-md border-slate-200 text-sm"
                    type="time"
                    name="hora_inicio"
                    id="hora_inicio"
                    value="{{ cita.hora_inicio|time:'H:i' }}"
                    required
                >
            </div>
        </div>

        <div class="grid gap-2">
            <label class="text-sm font-semibold text-slate-600" for="estado_id">Estado</label>
            <select class="rounded-md border-slate-200 text-sm" name="estado_id" id="estado_id" required>
                <option value="">Seleccione un estado</option>
                {% for estado in estados %}
                    <option value="{{ estado.id }}" {% if cita.estado.id == estado.id %}selected{% endif %}>
                        {{ estado.nombre }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="grid gap-2">
            <label class="text-sm font-semibold text-slate-600" for="anotaciones">Anotaciones</label>
            <textarea
                class="min-h-[120px] rounded-md border-slate-200 text-sm"
                name="anotaciones"
                id="anotaciones"
                placeholder="Anotaciones"
            >{{ cita.anotaciones }}</textarea>
        </div>

        <div class="flex flex-wrap items-center justify-end gap-3">
            <a
                class="rounded-md border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 transition-colors hover:border-slate-400"
                href="{% url 'citas_lista' %}"
            >
                Cancelar
            </a>
            <button
                class="rounded-md bg-primary px-5 py-2 text-sm font-semibold text-white transition-colors hover:bg-slate-800"
                type="submit"
            >
                Guardar
            </button>
        </div>
    </form>
</div>
{% endblock %}
