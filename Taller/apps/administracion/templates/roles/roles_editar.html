{% extends 'base.html' %}
{% block title %}Editar Rol{% endblock %}
{% block page_title %}Editar Rol{% endblock %}

{% block page_actions %}
<nav aria-label="Navegacion de roles">
    <a href="{% url 'roles_lista' %}">Regresar</a>
</nav>
{% endblock %}

{% block content %}
<h1>Editar Rol</h1>
    <form action="" method="post">
        {% csrf_token %}
        <input type="text" name="nombre" value="{{ rol.nombre }}" required placeholder="Nombre del Rol">
        <input type="text" name="descripcion" value="{{ rol.descripcion }}" placeholder="Descripción del Rol">

        <fieldset>
            <legend>Permisos por rol</legend>
            {% for item in permission_options %}
                <label style="display:block; margin-bottom:0.45rem;">
                    <input type="checkbox" name="perm_{{ item.key }}" {% if item.key in selected_permission_keys %}checked{% endif %}> {{ item.label }}
                    <small style="display:block; color:#5c6670; margin-left:1.4rem;">{{ item.description }}</small>
                </label>
            {% endfor %}
        </fieldset>

        <button type="submit">Guardar</button>
    </form>
{% endblock %}
