{% extends 'base.html' %}
{% load static %}
{% block title %}Vehiculos{% endblock %}
{% block page_title %}Vehiculos{% endblock %}

{% block extra_head %}
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/css/select2.min.css" rel="stylesheet">
{% endblock %}

{% block page_actions %}
<nav aria-label="Navegacion de vehiculos">
    <a
        class="rounded-md border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 transition-colors hover:border-slate-400"
        href="{% url 'vehiculos_lista' %}"
    >
        Regresar
    </a>
</nav>
{% endblock %}

{% block content %}
<div class="border border-slate-200 bg-white p-6 shadow-sm">
    <h3 class="text-base font-semibold text-slate-900">Crear vehiculo</h3>
    <form method="post" class="mt-4 grid gap-6">
        {% csrf_token %}

        <div class="grid gap-4 lg:grid-cols-2">
            <div class="grid gap-2">
                <label class="text-sm font-semibold text-slate-600" for="cliente_id">Propietario</label>
                <select class="rounded-md border-slate-200 text-sm" id="cliente_id" name="cliente_id" required>
                    <option value="">Seleccione el propietario del vehiculo</option>
                    {% for cliente in clientes %}
                        <option value="{{ cliente.id }}">{{ cliente.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="grid gap-2">
                <label class="text-sm font-semibold text-slate-600" for="cliente_cedula">Cedula</label>
                <input class="rounded-md border-slate-200 text-sm bg-slate-50" type="text" id="cliente_cedula" readonly placeholder="Se completa al seleccionar cliente">
            </div>
            <div class="grid gap-2">
                <label class="text-sm font-semibold text-slate-600" for="cliente_telefono">Telefono</label>
                <input class="rounded-md border-slate-200 text-sm bg-slate-50" type="text" id="cliente_telefono" readonly placeholder="Se completa al seleccionar cliente">
            </div>
            <div class="grid gap-2">
                <label class="text-sm font-semibold text-slate-600" for="cliente_correo">Correo</label>
                <input class="rounded-md border-slate-200 text-sm bg-slate-50" type="text" id="cliente_correo" readonly placeholder="Se completa al seleccionar cliente">
            </div>
            <div class="grid gap-2 lg:col-span-2">
                <label class="text-sm font-semibold text-slate-600" for="cliente_direccion">Direccion</label>
                <input class="rounded-md border-slate-200 text-sm bg-slate-50" type="text" id="cliente_direccion" readonly placeholder="Se completa al seleccionar cliente">
            </div>
        </div>

        <div class="grid gap-4 md:grid-cols-2">
            <div class="grid gap-2">
                <label class="text-sm font-semibold text-slate-600" for="placa">Placa</label>
                <input class="rounded-md border-slate-200 text-sm" type="text" id="placa" name="placa" required placeholder="Placa">
            </div>
            <div class="grid gap-2">
                <label class="text-sm font-semibold text-slate-600" for="anio">Ano</label>
                <input class="rounded-md border-slate-200 text-sm" type="text" id="anio" name="anio" required placeholder="Ano del vehiculo">
            </div>
            <div class="grid gap-2">
                <label class="text-sm font-semibold text-slate-600" for="color">Color</label>
                <input class="rounded-md border-slate-200 text-sm" type="text" id="color" name="color" required placeholder="Color">
            </div>
            <div class="grid gap-2">
                <label class="text-sm font-semibold text-slate-600" for="vin">VIN</label>
                <input class="rounded-md border-slate-200 text-sm" type="text" id="vin" name="vin" required placeholder="VIN del vehiculo">
            </div>
        </div>

        <div class="grid gap-4 md:grid-cols-3">
            <div class="grid gap-2">
                <label class="text-sm font-semibold text-slate-600" for="modelo_id">Modelo</label>
                <select class="rounded-md border-slate-200 text-sm" id="modelo_id" name="modelo_id" required>
                    <option value="">Seleccione el modelo</option>
                    {% for modelo in modelos %}
                        <option value="{{ modelo.id }}">{{ modelo.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="grid gap-2">
                <label class="text-sm font-semibold text-slate-600" for="marca_id">Marca</label>
                <select class="rounded-md border-slate-200 text-sm" id="marca_id" name="marca_id" required>
                    <option value="">Seleccione la marca</option>
                    {% for marca in marcas %}
                        <option value="{{ marca.id }}">{{ marca.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="grid gap-2">
                <label class="text-sm font-semibold text-slate-600" for="combustible_id">Combustible</label>
                <select class="rounded-md border-slate-200 text-sm" id="combustible_id" name="combustible_id" required>
                    <option value="">Seleccione el tipo de combustible</option>
                    {% for combustible in combustibles %}
                        <option value="{{ combustible.id }}">{{ combustible.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="flex flex-wrap items-center justify-end gap-3">
            <a class="rounded-md border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 transition-colors hover:border-slate-400" href="{% url 'vehiculos_lista' %}">Cancelar</a>
            <button class="rounded-md bg-primary px-5 py-2 text-sm font-semibold text-white transition-colors hover:bg-slate-800" type="submit">Guardar</button>
        </div>
    </form>
</div>

    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/js/select2.min.js"></script>
    <script
        src="{% static 'js/vehiculos.js' %}"
        data-cliente-detalle-url="{% url 'clientes_detalle_json' 0 %}"
    ></script>
{% endblock %}
