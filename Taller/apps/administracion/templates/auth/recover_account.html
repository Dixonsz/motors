<!doctype html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Recuperar Contraseña | M&M Motors</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#2563EB",
              "tertiary-container": "#1E293B",
              "on-primary": "#ffffff",
              "on-background": "#1E293B",
              "on-surface": "#1E293B",
              "on-surface-variant": "#64748B",
              "outline": "#CBD5E1",
              "outline-variant": "#E2E8F0",
              "background": "#EFF6FF",
              "surface": "#F8FAFC",
              "surface-container-low": "#F1F5F9",
              "surface-container-lowest": "#FFFFFF",
              "surface-variant": "#E2E8F0",
              "inverse-surface": "#0F172A",
              "inverse-on-surface": "#F8FAFC",
              "primary-container": "#DBEAFE",
              "on-primary-container": "#1E40AF"
            },
            borderRadius: {
              DEFAULT: "0.125rem",
              lg: "0.25rem",
              xl: "0.5rem",
              full: "0.75rem",
            },
            spacing: {
              unit: "4px",
              "section-margin": "48px",
              "form-row-gap": "24px",
              "container-padding": "32px",
              gutter: "24px",
              "element-gap": "16px",
            },
            fontFamily: {
              h2: ["Inter"],
              "body-md": ["Inter"],
              "label-caps": ["Inter"],
              "data-mono": ["monospace"],
              "body-lg": ["Inter"],
              h3: ["Inter"],
              h1: ["Inter"],
            },
            fontSize: {
              h2: [
                "24px",
                {
                  lineHeight: "1.3",
                  letterSpacing: "-0.01em",
                  fontWeight: "600",
                },
              ],
              "body-md": [
                "14px",
                { lineHeight: "1.5", letterSpacing: "0em", fontWeight: "400" },
              ],
              "label-caps": [
                "12px",
                {
                  lineHeight: "1.2",
                  letterSpacing: "0.05em",
                  fontWeight: "700",
                },
              ],
              "data-mono": [
                "13px",
                { lineHeight: "1.5", letterSpacing: "0em", fontWeight: "400" },
              ],
              "body-lg": [
                "16px",
                { lineHeight: "1.6", letterSpacing: "0em", fontWeight: "400" },
              ],
              h3: [
                "18px",
                { lineHeight: "1.4", letterSpacing: "0em", fontWeight: "600" },
              ],
              h1: [
                "32px",
                {
                  lineHeight: "1.2",
                  letterSpacing: "-0.02em",
                  fontWeight: "600",
                },
              ],
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #f7f9fb;
      }
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      .soft-executive-shadow {
        box-shadow:
          0 4px 6px -1px rgba(15, 23, 42, 0.05),
          0 2px 4px -2px rgba(15, 23, 42, 0.03);
      }
      input:focus {
        outline: none;
        border-bottom-color: #091426 !important;
      }
    </style>
  </head>
  <body class="bg-surface text-on-surface min-h-screen flex flex-col">
    <main class="flex-grow flex items-center justify-center px-gutter">
      <div class="w-full max-w-[440px]">
        <!-- Logo Section -->
        <div class="text-center mb-section-margin">
          <h1
            class="text-lg font-bold tracking-tighter text-slate-900 uppercase"
          >
            M&M MOTORS
          </h1>
        </div>
        <!-- Recovery Card -->
        <div
          class="bg-surface-container-lowest border border-outline-variant p-container-padding soft-executive-shadow rounded-lg"
        >
          <div class="mb-section-margin">
            <h2 class="font-h2 text-h2 text-primary mb-2">Recuperar Acceso</h2>
            <p class="font-body-md text-body-md text-on-surface-variant">
              Ingrese su dirección de correo electrónico para recibir un enlace
              de restablecimiento de contraseña.
            </p>
          </div>
          <form class="space-y-form-row-gap">
            <div class="flex flex-col gap-2">
              <label
                class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest"
                for="email"
                >Correo Electrónico</label
              >
              <div class="relative group">
                <span
                  class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant transition-colors group-focus-within:text-primary"
                  data-icon="mail"
                  >mail</span
                >
                <input
                  class="w-full pl-10 pr-4 py-3 bg-surface-container-low border-0 border-b-2 border-outline-variant font-body-md text-body-md transition-all placeholder:text-outline"
                  id="email"
                  placeholder="Ingrese su correo electrónico"
                  required=""
                  type="email"
                />
              </div>
            </div>
            <button
              class="w-full py-4 bg-primary-container text-on-primary font-body-lg text-body-lg font-semibold hover:opacity-90 transition-opacity flex items-center justify-center gap-2"
              type="submit"
            >
              Enviar Enlace de Recuperación
            </button>
          </form>
          <div class="mt-section-margin text-center">
            <a
              class="inline-flex items-center gap-2 font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors underline underline-offset-4 decoration-outline-variant hover:decoration-primary"
              href="{% url 'login' %}"
            >
              
              Volver al Inicio de Sesión
            </a>
          </div>
        </div>
        
      </div>
    </main>
    <footer
      class="w-full border-t border-slate-200 bg-slate-50 flex justify-between items-center px-8 py-6"
    >
      <div
        class="font-['Inter'] text-xs uppercase tracking-widest text-slate-400"
      >
        © 2026 M&M MOTORS. Todos los derechos reservados.
      </div>
    </footer>
  </body>
</html>
