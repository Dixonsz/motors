<!-- detalle_editar.html -->
{% extends 'base.html' %}
{% block title %}Editar Servicio{% endblock %}
{% block page_title %}Editar Servicio{% endblock %}

{% block page_actions %}
<nav aria-label="Navegacion de ordenes">
    <a
        class="rounded-md border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 transition-colors hover:border-slate-400"
        href="{% url 'orden_detalle' detalle.orden.id %}"
    >
        Regresar
    </a>
</nav>
{% endblock %}

{% block content %}
<div class="border border-slate-200 bg-white p-6 shadow-sm">
    <div class="mb-4 rounded-md border border-slate-100 bg-slate-50 px-4 py-3 text-sm text-slate-700">
        <span class="font-semibold">Servicio:</span> {{ detalle.servicio.nombre }}
    </div>

    <form action="" class="grid gap-6" method="post">
        {% csrf_token %}
        <div class="grid gap-4 md:grid-cols-2">
            <div class="grid gap-2">
                <label class="text-sm font-semibold text-slate-600" for="precio">Precio</label>
                <input class="rounded-md border-slate-200 text-sm" type="number" name="precio" id="precio" value="{{ detalle.precio }}" min="0" required>
            </div>
            <div class="grid gap-2">
                <label class="text-sm font-semibold text-slate-600" for="cantidad">Cantidad</label>
                <input class="rounded-md border-slate-200 text-sm" type="number" name="cantidad" id="cantidad" value="{{ detalle.cantidad }}" min="1" required>
            </div>
        </div>
        <div class="grid gap-2">
            <label class="text-sm font-semibold text-slate-600" for="observaciones">Observaciones</label>
            <textarea class="min-h-[120px] rounded-md border-slate-200 text-sm" name="observaciones" id="observaciones" placeholder="Observaciones">{{ detalle.observaciones }}</textarea>
        </div>

        <div class="flex flex-wrap items-center justify-end gap-3">
            <a
                class="rounded-md border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 transition-colors hover:border-slate-400"
                href="{% url 'orden_detalle' detalle.orden.id %}"
            >
                Cancelar
            </a>
            <button
                class="rounded-md bg-primary px-5 py-2 text-sm font-semibold text-white transition-colors hover:bg-slate-800"
                type="submit"
            >
                Guardar
            </button>
        </div>
    </form>
</div>
{% endblock %}
